<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>G-Class Lounge | Admin</title>


    <script src="https://cdn.tailwindcss.com"></script>


    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


</head>


<body class="bg-[#0b0b0b]">


    <!-- HEADER -->

    <header class="bg-black border-b border-[#D4AF37]/20 py-6">


        <div class="max-w-7xl mx-auto px-8 flex justify-between items-center">


            <h1 class="text-3xl font-bold text-[#D4AF37]">

                <i class="fa-solid fa-user-shield mr-2"></i>

                G-Class Admin

            </h1>



            <a href="index.html"
                class="border border-[#D4AF37] text-[#D4AF37] px-5 py-2 rounded-full hover:bg-[#D4AF37] hover:text-black transition">

                Back To Website

            </a>


        </div>


    </header>





    <!-- ORDERS -->

    <section class="py-16">


        <div class="max-w-7xl mx-auto px-8">


            <p class="text-center text-[#D4AF37] uppercase tracking-[5px]">

                Management Panel

            </p>


            <h2 class="text-center text-5xl font-bold text-white mt-3">

                Customer Orders

            </h2>



            <div class="w-24 h-1 bg-[#D4AF37] mx-auto mt-5 mb-14 rounded-full"></div>
            <div class="flex justify-end gap-4 mb-10">

                <button onclick="openAddItemModal()" class="bg-[#D4AF37] text-black px-6 py-3 rounded-xl font-bold">
                    Add New Item
                </button>

                <button onclick="scrollToMenuItems()" class="bg-red-500 text-white px-6 py-3 rounded-xl font-bold">

                    Delete Item

                </button>

            </div>

            <!-- DASHBOARD STATS -->

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-14">

                <!-- Total Orders -->

                <div
                    class="bg-[#171412] border border-[#D4AF37]/20 rounded-3xl p-6 hover:border-[#D4AF37] transition-all duration-300">

                    <div class="flex justify-between items-center">

                        <div>

                            <p class="text-gray-400">
                                Total Orders
                            </p>

                            <h2 id="total-orders" class="text-4xl font-bold text-white mt-2">
                                0
                            </h2>

                        </div>

                        <div class="w-14 h-14 rounded-2xl bg-[#D4AF37]/20 flex items-center justify-center">

                            <i class="fa-solid fa-cart-shopping text-2xl text-[#D4AF37]"></i>

                        </div>

                    </div>

                </div>



                <!-- Revenue -->

                <div
                    class="bg-[#171412] border border-[#D4AF37]/20 rounded-3xl p-6 hover:border-[#D4AF37] transition-all duration-300">

                    <div class="flex justify-between items-center">

                        <div>

                            <p class="text-gray-400">
                                Revenue
                            </p>

                            <h2 id="total-revenue" class="text-4xl font-bold text-[#D4AF37] mt-2">
                                ₹0
                            </h2>

                        </div>

                        <div class="w-14 h-14 rounded-2xl bg-[#D4AF37]/20 flex items-center justify-center">

                            <i class="fa-solid fa-indian-rupee-sign text-2xl text-[#D4AF37]"></i>

                        </div>

                    </div>

                </div>



                <!-- Items Sold -->

                <div
                    class="bg-[#171412] border border-[#D4AF37]/20 rounded-3xl p-6 hover:border-[#D4AF37] transition-all duration-300">

                    <div class="flex justify-between items-center">

                        <div>

                            <p class="text-gray-400">
                                Items Sold
                            </p>

                            <h2 id="items-sold" class="text-4xl font-bold text-white mt-2">
                                0
                            </h2>

                        </div>

                        <div class="w-14 h-14 rounded-2xl bg-[#D4AF37]/20 flex items-center justify-center">

                            <i class="fa-solid fa-mug-hot text-2xl text-[#D4AF37]"></i>

                        </div>

                    </div>

                </div>



                <!-- Pending -->

                <div
                    class="bg-[#171412] border border-[#D4AF37]/20 rounded-3xl p-6 hover:border-[#D4AF37] transition-all duration-300">

                    <div class="flex justify-between items-center">

                        <div>

                            <p class="text-gray-400">
                                Pending
                            </p>

                            <h2 id="pending-orders" class="text-4xl font-bold text-yellow-400 mt-2">
                                0
                            </h2>

                        </div>

                        <div class="w-14 h-14 rounded-2xl bg-yellow-500/20 flex items-center justify-center">

                            <i class="fa-solid fa-clock text-2xl text-yellow-400"></i>

                        </div>

                    </div>

                </div>

            </div>



            <div id="orders-container" class="grid md:grid-cols-2 gap-8">


            </div>

            <h2 class="text-4xl text-white font-bold mt-16 mb-8">
                Table Bookings
            </h2>

            <div id="booking-container" class="grid md:grid-cols-2 gap-8"></div>





            <h2 id="menu-items-section" class="text-4xl text-white font-bold mt-16 mb-8">

                Menu Items

            </h2>

            <div id="menu-items-container" class="grid md:grid-cols-2 lg:grid-cols-3 gap-8"></div>

        </div>



    </section>


    <!-- ADD ITEM MODAL -->

    <div id="add-item-modal" class="hidden fixed inset-0 bg-black/80 z-[9999] flex items-center justify-center px-5">

        <div class="bg-[#171412] border border-[#D4AF37]/30 rounded-3xl p-8 w-full max-w-lg">

            <h2 class="text-3xl text-[#D4AF37] font-bold text-center mb-6">

                Add New Menu Item

            </h2>

            <input id="item-name" type="text" placeholder="Item Name"
                class="w-full p-4 rounded-xl bg-black text-white border border-gray-700 mb-4">

            <input id="item-price" type="number" placeholder="Price"
                class="w-full p-4 rounded-xl bg-black text-white border border-gray-700 mb-4">

            <select id="item-category" class="w-full p-4 rounded-xl bg-black text-white border border-gray-700 mb-4">

                <option value="chai">Chai</option>
                <option value="coffee">Coffee</option>
                <option value="snacks">Snacks</option>
                <option value="desserts">Desserts</option>

            </select>

            <input id="item-image" type="text" placeholder="Image Path (images/item.png)"
                class="w-full p-4 rounded-xl bg-black text-white border border-gray-700 mb-4">

            <textarea id="item-description" placeholder="Description"
                class="w-full p-4 rounded-xl bg-black text-white border border-gray-700 mb-4"></textarea>

            <button onclick="saveNewItem()" class="w-full bg-[#D4AF37] text-black py-3 rounded-xl font-bold">

                Save Item

            </button>

            <button onclick="closeAddItemModal()" class="w-full mt-4 text-gray-400">

                Cancel

            </button>

        </div>

    </div>





    <script>


        function displayOrders() {


            let container = document.getElementById("orders-container");


            let orders = JSON.parse(localStorage.getItem("orders")) || [];


            container.innerHTML = "";



            if (orders.length === 0) {


                container.innerHTML = `

<div class="text-center text-gray-400 col-span-full">

<h3 class="text-2xl">
No Orders Found
</h3>

</div>

`;

                return;

            }




            orders.forEach(order => {


                container.innerHTML += `


<div class="bg-[#171412] p-8 rounded-3xl border border-[#D4AF37]/20">


<h3 class="text-2xl text-white font-bold">

${order.customerName}

</h3>


<p class="text-gray-400 mt-2">

<i class="fa-solid fa-phone text-[#D4AF37]"></i>

${order.phone}

</p>



<div class="mt-5 text-gray-300">


${order.items.map(item => `

<p>
☕ ${item.name} × ${item.quantity}
</p>

`).join("")}


</div>



<p class="text-[#D4AF37] text-xl font-bold mt-5">

Total : ₹${order.total}

</p>



<p class="text-gray-400 mt-2">

${order.date} | ${order.time}

</p>



<div class="mt-5 flex items-center justify-between">

<div>

<p class="text-gray-400 text-sm">
Status
</p>

<span class="${order.status === "Pending"
                        ? "text-yellow-400"
                        : order.status === "Preparing"
                            ? "text-blue-400"
                            : "text-green-400"} font-semibold">

${order.status}

</span>

</div>

<button
onclick="changeStatus(${order.id})"
class="bg-[#D4AF37] text-black px-4 py-2 rounded-lg font-semibold hover:scale-105 transition">

Next Status

</button>

</div>



<button
onclick="deleteOrder(${order.id})"
class="mt-6 bg-red-500 text-white px-5 py-2 rounded-full">

Delete Order

</button>


</div>


`;


            });


        }




        function deleteOrder(id) {


            let orders = JSON.parse(localStorage.getItem("orders")) || [];


            orders = orders.filter(order => order.id !== id);



            localStorage.setItem("orders", JSON.stringify(orders));



            displayOrders();


        }

        function changeStatus(id) {

            let orders = JSON.parse(localStorage.getItem("orders")) || [];

            orders.forEach(order => {

                if (order.id === id) {

                    if (order.status === "Pending") {

                        order.status = "Preparing";

                    } else if (order.status === "Preparing") {

                        order.status = "Completed";

                    }

                }

            });

            localStorage.setItem("orders", JSON.stringify(orders));

            displayOrders();
            updateDashboard();

        }

        function updateDashboard() {

            const orders = JSON.parse(localStorage.getItem("orders")) || [];

            document.getElementById("total-orders").innerText = orders.length;

            let revenue = 0;
            let itemsSold = 0;
            let pending = 0;

            orders.forEach(order => {

                revenue += order.total;

                order.items.forEach(item => {
                    itemsSold += item.quantity;
                });

                if (order.status === "Pending") {
                    pending++;
                }

            });

            document.getElementById("total-revenue").innerText = `₹${revenue}`;
            document.getElementById("items-sold").innerText = itemsSold;
            document.getElementById("pending-orders").innerText = pending;

        }

        function displayBookings() {

            let container = document.getElementById("booking-container");

            let bookings = JSON.parse(localStorage.getItem("bookings")) || [];

            container.innerHTML = "";

            if (bookings.length === 0) {

                container.innerHTML = `
            <div class="text-center text-gray-400 col-span-full">
                <h3 class="text-2xl">No Table Bookings</h3>
            </div>
        `;

                return;
            }

            bookings.forEach(booking => {

                if (!booking.status) {
                    booking.status = "Pending";
                }

                container.innerHTML += `

        <div class="bg-[#171412] p-8 rounded-3xl border border-[#D4AF37]/20">

            <h3 class="text-2xl text-white font-bold">
                ${booking.name}
            </h3>

            <p class="text-gray-400 mt-3">
                <i class="fa-solid fa-phone text-[#D4AF37]"></i>
                ${booking.phone}
            </p>

            <p class="text-gray-400 mt-2">
                <i class="fa-solid fa-users text-[#D4AF37]"></i>
                ${booking.guests}
            </p>

            <p class="text-gray-400 mt-2">
                <i class="fa-solid fa-calendar text-[#D4AF37]"></i>
                ${booking.date}
            </p>

            <p class="text-gray-400 mt-2">
                <i class="fa-solid fa-clock text-[#D4AF37]"></i>
                ${booking.time}
            </p>

            <p class="text-gray-300 mt-3">
                <span class="text-[#D4AF37] font-semibold">Special Request:</span>
                ${booking.description || "No Special Request"}
            </p>

            <div class="mt-5">

    <select onchange="updateBookingStatus(${booking.id}, this.value)"
        class="w-full bg-[#111] border border-[#D4AF37]/30 rounded-lg p-3 text-white">

        <option value="Pending" ${booking.status === "Pending" ? "selected" : ""}>
            Pending
        </option>

        <option value="Confirmed" ${booking.status === "Confirmed" ? "selected" : ""}>
            Confirmed
        </option>

        <option value="Cancelled" ${booking.status === "Cancelled" ? "selected" : ""}>
            Cancelled
        </option>

    </select>

</div>

            <button
                onclick="deleteBooking(${booking.id})"
                class="mt-6 bg-red-500 text-white px-5 py-2 rounded-full">

                Delete Booking

            </button>

        </div>

        `;

            });

        }

        function deleteBooking(id) {

            let bookings = JSON.parse(localStorage.getItem("bookings")) || [];

            bookings = bookings.filter(booking => booking.id !== id);

            localStorage.setItem("bookings", JSON.stringify(bookings));

            displayBookings();

        }

        function updateBookingStatus(id, status) {

            let bookings = JSON.parse(localStorage.getItem("bookings")) || [];

            bookings.forEach(booking => {

                if (booking.id === id) {
                    booking.status = status;
                }

            });

            localStorage.setItem("bookings", JSON.stringify(bookings));

            displayBookings();

        }

        function openAddItemModal() {

            document.getElementById("add-item-modal").classList.remove("hidden");

        }

        function closeAddItemModal() {

            document.getElementById("add-item-modal").classList.add("hidden");

        }

        function saveNewItem() {

            let products = JSON.parse(localStorage.getItem("menuItems")) || [];

            const newItem = {

                id: Date.now(),

                name: document.getElementById("item-name").value,

                price: Number(document.getElementById("item-price").value),

                image: document.getElementById("item-image").value,

                description: document.getElementById("item-description").value,

                category: document.getElementById("item-category").value.toLowerCase(),

                rating: 5.0,

                quantity: 1,

                badge: "New",

                color: "blue"

            };

            products.push(newItem);

            localStorage.setItem("menuItems", JSON.stringify(products));

            alert("New Product Added Successfully!");

            closeAddItemModal();

        }


        function displayMenuItems() {

            let container = document.getElementById("menu-items-container");

            let menu = JSON.parse(localStorage.getItem("menuItems")) || [];

            container.innerHTML = "";

            if (menu.length === 0) {

                container.innerHTML = `
        <p class="text-gray-400 text-xl col-span-full">
            No Menu Items Found
        </p>
        `;

                return;
            }

            menu.forEach(item => {

                container.innerHTML += `

        <div class="bg-[#171412] border border-[#D4AF37]/20 rounded-3xl overflow-hidden">

            <img src="${item.image}" class="w-full h-60 object-cover">

            <div class="p-5">

                <h3 class="text-2xl text-white font-bold">
                    ${item.name}
                </h3>

                <p class="text-gray-400 mt-2">
                    ₹${item.price}
                </p>

                <button
                    onclick="deleteMenuItem(${item.id})"
                    class="mt-5 bg-red-500 text-white px-5 py-2 rounded-full">

                    Delete Item

                </button>

            </div>

        </div>

        `;

            });

        }

        function deleteMenuItem(id) {

            let menu = JSON.parse(localStorage.getItem("menuItems")) || [];

            menu = menu.filter(item => item.id !== id);

            localStorage.setItem("menuItems", JSON.stringify(menu));

            displayMenuItems();

        }

        function scrollToMenuItems() {

            document.getElementById("menu-items-section").scrollIntoView({

                behavior: "smooth"

            });

        }



        displayOrders();
        updateDashboard();
        displayBookings();
        displayMenuItems();


    </script>



</body>

</html>
