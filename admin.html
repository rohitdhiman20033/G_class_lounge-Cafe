<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>G-Class Lounge | Admin</title>


    <script src="https://cdn.tailwindcss.com"></script>


    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


</head>


<body class="bg-[#0b0b0b]">


    <!-- HEADER -->

    <header class="bg-black border-b border-[#D4AF37]/20 py-6">


        <div class="max-w-7xl mx-auto px-8 flex justify-between items-center">


            <h1 class="text-3xl font-bold text-[#D4AF37]">

                <i class="fa-solid fa-user-shield mr-2"></i>

                G-Class Admin

            </h1>



            <a href="index.html"
                class="border border-[#D4AF37] text-[#D4AF37] px-5 py-2 rounded-full hover:bg-[#D4AF37] hover:text-black transition">

                Back To Website

            </a>


        </div>


    </header>





    <!-- ORDERS -->

    <section class="py-16">


        <div class="max-w-7xl mx-auto px-8">


            <p class="text-center text-[#D4AF37] uppercase tracking-[5px]">

                Management Panel

            </p>


            <h2 class="text-center text-5xl font-bold text-white mt-3">

                Customer Orders

            </h2>



            <div class="w-24 h-1 bg-[#D4AF37] mx-auto mt-5 mb-14 rounded-full"></div>
            <div class="flex justify-end gap-4 mb-10">

                <button onclick="openAddItemModal()" class="bg-[#D4AF37] text-black px-6 py-3 rounded-xl font-bold">
                    Add New Item
                </button>

                <button onclick="scrollToMenuItems()" class="bg-red-500 text-white px-6 py-3 rounded-xl font-bold">

                    Delete Item

                </button>

            </div>

            <!-- DASHBOARD STATS -->

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-14">

                <!-- Total Orders -->

                <div
                    class="bg-[#171412] border border-[#D4AF37]/20 rounded-3xl p-6 hover:border-[#D4AF37] transition-all duration-300">

                    <div class="flex justify-between items-center">

                        <div>

                            <p class="text-gray-400">
                                Total Orders
                            </p>

                            <h2 id="total-orders" class="text-4xl font-bold text-white mt-2">
                                0
                            </h2>

                        </div>

                        <div class="w-14 h-14 rounded-2xl bg-[#D4AF37]/20 flex items-center justify-center">

                            <i class="fa-solid fa-cart-shopping text-2xl text-[#D4AF37]"></i>

                        </div>

                    </div>

                </div>



                <!-- Revenue -->

                <div
                    class="bg-[#171412] border border-[#D4AF37]/20 rounded-3xl p-6 hover:border-[#D4AF37] transition-all duration-300">

                    <div class="flex justify-between items-center">

                        <div>

                            <p class="text-gray-400">
                                Revenue
                            </p>

                            <h2 id="total-revenue" class="text-4xl font-bold text-[#D4AF37] mt-2">
                                ₹0
                            </h2>

                        </div>

                        <div class="w-14 h-14 rounded-2xl bg-[#D4AF37]/20 flex items-center justify-center">

                            <i class="fa-solid fa-indian-rupee-sign text-2xl text-[#D4AF37]"></i>

                        </div>

                    </div>

                </div>



                <!-- Items Sold -->

                <div
                    class="bg-[#171412] border border-[#D4AF37]/20 rounded-3xl p-6 hover:border-[#D4AF37] transition-all duration-300">

                    <div class="flex justify-between items-center">

                        <div>

                            <p class="text-gray-400">
                                Items Sold
                            </p>

                            <h2 id="items-sold" class="text-4xl font-bold text-white mt-2">
                                0
                            </h2>

                        </div>

                        <div class="w-14 h-14 rounded-2xl bg-[#D4AF37]/20 flex items-center justify-center">

                            <i class="fa-solid fa-mug-hot text-2xl text-[#D4AF37]"></i>

                        </div>

                    </div>

                </div>



                <!-- Pending -->

                <div
                    class="bg-[#171412] border border-[#D4AF37]/20 rounded-3xl p-6 hover:border-[#D4AF37] transition-all duration-300">

                    <div class="flex justify-between items-center">

                        <div>

                            <p class="text-gray-400">
                                Pending
                            </p>

                            <h2 id="pending-orders" class="text-4xl font-bold text-yellow-400 mt-2">
                                0
                            </h2>

                        </div>

                        <div class="w-14 h-14 rounded-2xl bg-yellow-500/20 flex items-center justify-center">

                            <i class="fa-solid fa-clock text-2xl text-yellow-400"></i>

                        </div>

                    </div>

                </div>

            </div>



            <div id="orders-container" class="grid md:grid-cols-2 gap-8">


            </div>

            <h2 class="text-4xl text-white font-bold mt-16 mb-8">
                Table Bookings
            </h2>

            <div id="booking-container" class="grid md:grid-cols-2 gap-8"></div>





            <h2 id="menu-items-section" class="text-4xl text-white font-bold mt-16 mb-8">

                Menu Items

            </h2>

            <div id="menu-items-container" class="grid md:grid-cols-2 lg:grid-cols-3 gap-8"></div>

        </div>



    </section>


    <!-- ADD ITEM MODAL -->

    <div id="add-item-modal" class="hidden fixed inset-0 bg-black/80 z-[9999] flex items-center justify-center px-5">

        <div class="bg-[#171412] border border-[#D4AF37]/30 rounded-3xl p-8 w-full max-w-lg">

            <h2 class="text-3xl text-[#D4AF37] font-bold text-center mb-6">

                Add New Menu Item

            </h2>

            <input id="item-name" type="text" placeholder="Item Name"
                class="w-full p-4 rounded-xl bg-black text-white border border-gray-700 mb-4">

            <input id="item-price" type="number" placeholder="Price"
                class="w-full p-4 rounded-xl bg-black text-white border border-gray-700 mb-4">

            <select id="item-category" class="w-full p-4 rounded-xl bg-black text-white border border-gray-700 mb-4">

                <option value="chai">Chai</option>
                <option value="coffee">Coffee</option>
                <option value="snacks">Snacks</option>
                <option value="desserts">Desserts</option>

            </select>

            <input id="item-image" type="text" placeholder="Image Path (images/item.png)"
                class="w-full p-4 rounded-xl bg-black text-white border border-gray-700 mb-4">

            <textarea id="item-description" placeholder="Description"
                class="w-full p-4 rounded-xl bg-black text-white border border-gray-700 mb-4"></textarea>

            <button onclick="saveNewItem()" class="w-full bg-[#D4AF37] text-black py-3 rounded-xl font-bold">

                Save Item

            </button>

            <button onclick="closeAddItemModal()" class="w-full mt-4 text-gray-400">

                Cancel

            </button>

        </div>

    </div>



    <script src="js/api.js"></script>
    <script src="js/admin.js"></script>


</body>

</html>
