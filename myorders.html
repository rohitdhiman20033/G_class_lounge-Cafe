<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        @keyframes fadeIn {

            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }
    </style>
</head>


<body>
    <div class="min-h-screen bg-[#0b0b0b] py-20 px-5">

        <div class="max-w-4xl mx-auto">

            <h1 class="text-5xl text-center text-[#D4AF37] font-bold">

                My Orders

            </h1>

            <div class="text-center mt-6">

                <a href="index.html"
                    class="inline-block bg-[#D4AF37] text-black px-8 py-3 rounded-xl font-bold hover:bg-[#b8962e] transition duration-300">

                    ← Back to Website

                </a>

            </div>




            <div id="orders-list" class="grid md:grid-cols-2 gap-8 mt-12">

            </div>

            <h2 class="text-4xl text-[#D4AF37] font-bold text-center mt-16">

                My Table Bookings

            </h2>

            <div id="bookings-list" class="grid md:grid-cols-2 gap-8 mt-10">

            </div>

        </div>

    </div>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script src="js/utils.js"></script>
<script src="js/toast.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>

<script src="js/checkout.js"></script>
<script src="js/order.js"></script>
         
</body>

</html>
